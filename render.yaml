services:
  - type: web
    name: skibidi-ielts-v2
    runtime: node
    plan: free
    region: singapore
    buildCommand: bash scripts/render-build.sh
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        sync: false
      - key: APP_URL
        sync: false
